    <text x="164" y="42" font-family="'Courier New',monospace" font-size="11" fill="#8B949E">Kotlin  •  Android SDK 34  •  MVVM  •  Room DB</text>
    <text x="38" y="68"  font-family="'Courier New',monospace" font-size="12" fill="#C9D1D9">Android app that silently intercepts and rejects calls from unknown/unsaved numbers using the</text>
    <text x="38" y="88"  font-family="'Courier New',monospace" font-size="12" fill="#C9D1D9">CallScreeningService API. Logs blocked calls with timestamp, region and carrier. Full dark-mode UI,</text>
    <text x="38" y="108" font-family="'Courier New',monospace" font-size="12" fill="#C9D1D9">in-app auto-update via GitHub releases, and 100% local data — no cloud dependency.</text>
